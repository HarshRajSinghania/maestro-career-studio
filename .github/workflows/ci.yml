name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend Test Suite (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Cache APT archives for TeX Live
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-texlive-v1
          restore-keys: |
            ${{ runner.os }}-apt-texlive-

      - name: Install TeX Live and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-plain-generic \
            texlive-xetex \
            build-essential

      - name: Install Python dependencies with dev and mcp extras
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -e ".[dev,mcp]"

      - name: Install Chromium for the extension browser tests
        run: |
          cd backend
          python -m playwright install --with-deps chromium

      # Nothing enforced this before, so 76 findings accumulated unnoticed and
      # buried anything real. Kept as its own step so a lint failure is not
      # mistaken for a test failure.
      - name: Lint with ruff
        run: cd backend && ruff check .

      # The parity tests that pin a Python twin to the web app's TypeScript
      # (tests/node_ts.py: agent names, the plain-sentence rule) run it under
      # node's type stripping, and FAIL rather than skip here when node is absent.
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run backend and MCP test suites
        env:
          # Skips the `slow` tests (a real backend, a venv install, the Linux memory budget):
          # the budget test downloads the same fastembed model as test_golden.py below.
          # The reviewer and the pilot run them (docs/native-install.md).
          MAESTRO_SKIP_SLOW: "1"
        run: |
          cd backend
          # tests/ats/test_golden.py is EXCLUDED on purpose: it pulls a fastembed
          # ONNX model from HuggingFace at runtime, which makes CI depend on a
          # third-party download and fail on a partial cache. Its coverage (the
          # real-embedding ATS golden output) is therefore NOT enforced here --
          # run it locally before touching services/ats/.
          #
          # -n auto runs one worker per core, and --dist loadfile keeps a file on one
          # worker, which tests/browser needs (one Chromium per package). Each worker
          # migrates its own throwaway SQLite file (tests/conftest.py).
          pytest tests/ mcp_server/tests/ -q -rs -n auto --dist loadfile --ignore=tests/ats/test_golden.py

  mcp-cold-install:
    name: MCP Server Cold Install (documented user command)
    runs-on: ubuntu-latest

    # The backend job installs ".[dev,mcp]" together; this job exercises both
    # transports without dev dependencies supplying a missing runtime package.
    #
    # This is the command in the README, run in a clean environment with no dev
    # extra to accidentally supply a missing dependency, and it launches the
    # real console script rather than importing a module.
    #
    # It exists because `mcp>=1.2` was once unbounded, resolved to mcp 2.0 on any
    # fresh install, and died on its first import — `mcp.server.fastmcp` had
    # moved. Every new user hit it immediately. The publish gate could not have
    # caught it either: its cold-clone check is Docker, and the image never
    # installs the mcp extra at all.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exactly what the README tells a user to install
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -e ".[mcp]"

      - name: Start the console script and require a clean exit
        run: |
          cd backend
          # STDIO server: closed stdin is an immediate, clean shutdown. Any
          # import-time or registration-time failure shows up as a non-zero exit.
          for profile in full hunt apply explore templates career; do
            echo "--- profile: $profile"
            MAESTRO_CS_MCP_PROFILE="$profile" \
            BACKEND_URL="http://localhost:8001" \
              maestro-career-studio-mcp < /dev/null
          done

      - name: Smoke full and hunt MCP profiles over HTTP
        env:
          BACKEND_URL: "http://127.0.0.1:8011"
          MAESTRO_CS_MCP_PROFILE: "full"
          ALLOWED_HOSTS: "127.0.0.1,localhost"
          NO_PROXY: "127.0.0.1,localhost"
          no_proxy: "127.0.0.1,localhost"
          SYNC_KEY_FILE: ""
          SYNC_REMOTE_URL: ""
          SYNC_PUBLIC_HOST: ""
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENAI_BASE_URL: ""
          JEV_API_KEY: ""
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
          LANGFUSE_HOST: ""
        run: |
          set -euo pipefail
          cd backend
          export DATA_DIR="$RUNNER_TEMP/mcp-http/data"
          export DATABASE_URL="sqlite:///$DATA_DIR/maestro_cs.sqlite3"
          for directory in APPLICATIONS SETTINGS LOGS EXPORTS BASE_RESUMES KB_DOCUMENTS MAESTRO_CS_PDF MAESTRO_CS_UPLOAD; do
            export "${directory}_DIR=$RUNNER_TEMP/mcp-http/$directory"
          done
          mkdir -p "$DATA_DIR"
          mcp_log="$RUNNER_TEMP/mcp-http-uvicorn.log"
          uvicorn app.main:app --host 127.0.0.1 --port 8011 --workers 1 > "$mcp_log" 2>&1 &
          mcp_pid=$!
          cleanup() {
            mcp_exit=$?
            kill "$mcp_pid" 2>/dev/null || true
            wait "$mcp_pid" 2>/dev/null || true
            if [ "$mcp_exit" -ne 0 ]; then cat "$mcp_log"; fi
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 1 "$BACKEND_URL/health" > /dev/null; then break; fi
            kill -0 "$mcp_pid"
            sleep 1
          done
          curl --fail --silent --max-time 1 "$BACKEND_URL/health"
          python - <<'PY'
          import asyncio
          import os

          import httpx
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          from mcp_server.profiles import HUNT_TOOLS
          from mcp_server.server import list_registered_tool_names

          async def tool_names(path):
              async with httpx.AsyncClient(trust_env=False) as http_client:
                  async with streamable_http_client(
                      os.environ["BACKEND_URL"] + path, http_client=http_client
                  ) as (read, write, _):
                      async with ClientSession(read, write) as session:
                          await session.initialize()
                          result = await session.list_tools()
                          return [tool.name for tool in result.tools]

          async def smoke():
              full = await tool_names("/mcp")
              assert len(full) == len(list_registered_tool_names()), full
              hunt = await tool_names("/mcp/hunt")
              assert len(hunt) == len(HUNT_TOOLS), hunt
              assert set(hunt) == HUNT_TOOLS, hunt
              print(f"HTTP MCP: {len(full)} full tools; {len(hunt)} hunt tools")

          async def main():
              await asyncio.wait_for(smoke(), timeout=30)

          asyncio.run(main())
          PY

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint scripts
        run: shellcheck scripts/*.sh

      - name: Lint native scripts
        run: shellcheck --external-sources --source-path=SCRIPTDIR backend/scripts/native/*.sh

  update-check:
    name: update.sh --check (no stack)
    runs-on: ubuntu-latest

    # The documented answer to "am I up to date?" is a read-only command that
    # must degrade honestly when the stack is down and still exit 0. This is
    # that command on a fresh checkout with no compose stack. fetch-depth: 0
    # because the default shallow clone has no tags.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run the documented --check command
        run: ./scripts/update.sh --check

  docs-gate:
    name: SYSTEM.md Header-Contract Gate
    runs-on: ubuntu-latest

    # SYSTEM.md's header says "integrate, don't append", "ledgers must shrink"
    # and "caps are earned". This is the machine half of that contract,
    # mirroring how .slopledger.json machine-checks the §13 migration ledger.
    # It also fails when a §6 invariant loses the test or module pinned in
    # .system_md_enforcement.json — the doc promising what the code no longer
    # does is the failure this repo has actually shipped. Stdlib only.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SYSTEM.md against its header contract
        run: python3 scripts/check_system_md.py

      # The .mcpb is a committed build artifact so users can install it out of
      # their own clone. Its predictable failure is silent staleness: edit the
      # manifest or the bridge, forget to re-pack, and the bundle keeps installing
      # older behaviour while everything looks fine. Compares contents, not
      # bytes, so a no-op re-pack does not fail on zip timestamps. Stdlib only,
      # so this needs no Node toolchain in the job.
      - name: Check the committed .mcpb matches its source
        run: python3 scripts/check_mcpb_bundle.py

      # Bridge tests cover HTTP sessions, restart replay, deadlines, JSON-RPC
      # output and literal user_config placeholders. In-test HTTP servers and
      # Node's built-in runner need no Docker or dependencies to install.
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run the .mcpb bridge tests
        run: node --test mcpb/tests/*.test.js

  frontend:
    name: Frontend Build & Type Check (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Verify TypeScript types
        run: cd frontend && npx tsc --noEmit

      # Renders the real ownership components under node's test runner. It needs
      # the installed packages, so it runs here; the backend job has none and
      # skips its copy (backend/tests/sync/test_frontend_ownership.py).
      - name: Render the ownership components
        run: cd frontend && node --test components/job-ownership.test.mjs

      # Renders the second-copy card under node's test runner. It needs the
      # installed packages, so it runs here; the backend job has none and
      # skips its copy (backend/tests/sync/test_pairing.py).
      - name: Render the second-copy card
        run: cd frontend && node --test components/settings/second-copy-section.test.mjs

      - name: Build Next.js production bundle
        run: cd frontend && npm run build

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Audits the LOCKFILE -- the exact versions the published image installs --
      # rather than whatever a fresh resolve happens to pick. A new advisory can
      # break this job on an unrelated PR; that is the point. Fix by regenerating
      # requirements.lock (command in backend/Dockerfile). To accept a finding
      # deliberately, add `--ignore-vuln <ID>` here WITH a comment saying why.
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.lock --disable-pip

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Dev-only advisories do not ship to users, so they do not block a merge.
      - name: Audit npm dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=high
